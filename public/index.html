<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Catálogo Marcia Personalizados</title><meta name="claude:viewport-fit-sides" content="cover"><meta name="author" content="Alan Leão"><meta name="copyright" content="© 2026 Alan Leão. Todos os direitos reservados."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap"><meta name="description" content="Personalizados de festa feitos à mão: caixinhas, topos de bolo, convites e lembrancinhas."><meta property="og:title" content="Marcia Personalizados"><meta property="og:description" content="Personalizados de festa feitos à mão: caixinhas, topos de bolo, convites e lembrancinhas."><style id="loja-css">

/* Layout: vitrine de papelaria de festa (cabeçalho da loja, filtros, grade de produtos, sacola que vira mensagem de WhatsApp) + painel do lojista em abas com barra de publicação */
:root{
  --bg:#ffe3ee; --surface:#ffffff; --ink:#2b1630; --muted:#735a70; --line:#f3cadb;
  --berry:#b0245f; --berry-ink:#ffffff;
  --t-pink:#ffd9e6; --t-teal:#cdeee8; --t-sun:#ffeab3; --t-lilac:#e6dcff;
  --art:#2b1630; --ok:#1f7a55; --warn:#a2560b; --off:#8a7a88;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --shadow:0 10px 30px rgba(60,20,50,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b1322; --surface:#36192b; --ink:#f6e9f1; --muted:#c7a9bd; --line:#4d2b40;
  --berry:#ff6fa6; --berry-ink:#2a0a19;
  --t-pink:#4a2236; --t-teal:#1d3d39; --t-sun:#47391a; --t-lilac:#33294f;
  --art:#f6e9f1; --ok:#62d3a0; --warn:#f0a95a; --off:#9c8a98; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b1322; --surface:#36192b; --ink:#f6e9f1; --muted:#c7a9bd; --line:#4d2b40;
  --berry:#ff6fa6; --berry-ink:#2a0a19;
  --t-pink:#4a2236; --t-teal:#1d3d39; --t-sun:#47391a; --t-lilac:#33294f;
  --art:#f6e9f1; --ok:#62d3a0; --warn:#f0a95a; --off:#9c8a98; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
body.acc-teal{--berry:#0f766e} body.acc-orange{--berry:#c2410c} body.acc-violet{--berry:#6d28d9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.acc-teal{--berry:#5eead4}:root:not([data-theme="light"]) body.acc-orange{--berry:#fdba74}:root:not([data-theme="light"]) body.acc-violet{--berry:#c4b5fd}}
:root[data-theme="dark"] body.acc-teal{--berry:#5eead4}:root[data-theme="dark"] body.acc-orange{--berry:#fdba74}:root[data-theme="dark"] body.acc-violet{--berry:#c4b5fd}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--berry)}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:13px;font-weight:600;margin:0}
.ok{color:var(--ok);font-size:13px;font-weight:600;margin:0}

/* Botões */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--berry);color:var(--berry-ink)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn-danger{color:var(--warn)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

/* Vitrine */
.preview-note{background:var(--t-sun);padding-block:10px;font-size:14px;font-weight:600}
.marquee{overflow:hidden;padding-block:16px 4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.mq-track{display:flex;gap:14px;width:max-content;animation:mq var(--mq-dur,120s) linear infinite}
.marquee:hover .mq-track,.marquee:focus-within .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(calc(-50% - 7px))}}
.mq-item{flex:none;width:150px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink)}
.mq-item img{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;border-radius:10px;display:block}
.mq-item span{font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
@media (max-width:620px){.mq-item{width:120px}}
@media (prefers-reduced-motion: reduce){.mq-track{animation:none}.marquee{overflow-x:auto;-webkit-mask-image:none;mask-image:none}}
.store{padding-block:28px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.logo{width:72px;height:72px;border-radius:50%;background:var(--berry);color:var(--berry-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;position:relative}
.logo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed var(--berry);opacity:.5}
.logo.has-img{background:var(--surface);border:1px solid var(--line)}
.logo.has-img img{width:100%;height:100%;object-fit:contain;border-radius:50%;padding:6px}
.logo-wide{height:72px;max-width:min(220px,40vw);display:flex;align-items:center}
.logo-wide img{max-height:100%;max-width:100%;object-fit:contain;display:block}
.logoedit{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.store h1{font-size:clamp(26px,4vw,40px);font-weight:800}
.store p{margin:4px 0 0;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.fact b{font-weight:700}
@media (max-width:620px){.store{grid-template-columns:auto 1fr}.store .hdr-actions{grid-column:1/-1;justify-content:flex-start}}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.clicard{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.clicard b{display:block;font-size:15px}
.clicard .hint{overflow-wrap:anywhere}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;padding-bottom:2px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shop-main{padding-block:22px 32px}
.howto{padding-block:8px 36px}
.howto h2{font-size:24px;font-weight:800}
.steps{list-style:none;counter-reset:passo;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:0;margin:16px 0 0}
.steps li{counter-increment:passo;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.steps li::before{content:counter(passo);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--berry);color:var(--berry-ink);font-weight:800;font-family:var(--display);margin-bottom:6px}
.steps b{font-size:16px}
.steps span{color:var(--muted);font-size:14px}
.site-foot{border-top:1px solid var(--line);background:var(--surface)}
.foot-in{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;padding-block:24px 104px}
.foot-in b{color:var(--ink);font-size:15px}
.foot-in p,.credit p{margin:2px 0 0}
.credit{text-align:right}
@media (max-width:620px){.credit{text-align:left}}
.panel-credit{color:var(--muted);font-size:13px;text-align:left;padding-block:0 110px;margin-top:-110px}
.count{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;padding:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.art{aspect-ratio:1/1;max-width:100%;width:100%;display:grid;place-items:center;position:relative;color:var(--art);overflow:hidden}
.art svg{width:58%;height:auto}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.art img.sq,.mini img.sq{object-fit:cover}
.tone-pink{background:var(--t-pink)} .tone-teal{background:var(--t-teal)} .tone-sun{background:var(--t-sun)} .tone-lilac{background:var(--t-lilac)}
.art .tag{position:absolute;z-index:1;left:10px;top:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface);padding:3px 8px;border-radius:6px}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:18px;font-weight:600}
.card .desc{color:var(--muted);font-size:14px;margin:0;flex:1}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.price strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.price small{color:var(--muted);font-size:12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding-block:0 30px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:var(--shadow);border-radius:999px;padding:14px 20px}
.fab .n{background:var(--berry-ink);color:var(--berry);border-radius:999px;min-width:24px;padding:0 7px;font-size:13px;line-height:24px}

/* Diálogos */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:20px;width:min(580px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:var(--shadow)}
dialog.sm{width:min(400px,calc(100% - 24px))}
dialog::backdrop{background:rgba(30,10,25,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:22px}
.dlg-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg-body>.art{flex-shrink:0;aspect-ratio:auto;height:min(55vh,420px)}
.dlg-body>.art img{position:absolute;inset:0;object-fit:contain}
.dlg-foot{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.x{background:transparent;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;flex:none}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
label .opt{font-weight:400;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:10px;font-weight:600}
label.check input{width:18px;height:18px;accent-color:var(--berry)}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tier{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg);text-align:left}
.tier[aria-pressed="true"]{border-color:var(--berry);box-shadow:inset 0 0 0 1px var(--berry)}
.tier b{display:block;font-size:15px}
.tier small{color:var(--muted);font-variant-numeric:tabular-nums}
.total{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.mini{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:var(--art);overflow:hidden}
.mini svg{width:70%} .mini img{width:100%;height:100%;object-fit:cover}
.item h4{margin:0;font-size:15px}
.item p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.linkbtn{background:none;border:0;color:var(--berry);cursor:pointer;font-size:13px;font-weight:700;padding:0}
.val{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--berry);box-shadow:inset 0 0 0 1px var(--berry)}
.howbox{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px dashed var(--berry);border-radius:14px}
.refgrid{display:flex;gap:8px;flex-wrap:wrap}
.refgrid:empty{display:none}
.ref{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.refgrid.sm .ref{width:48px;height:48px;border-radius:8px}
.refgrid.sm{margin:6px 0}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px;line-height:1;box-shadow:var(--shadow)}
.sendrefs{flex-basis:100%;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;margin:0;max-height:220px;overflow:auto}

/* Painel */
.phead{padding-block:24px 8px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:end}
.phead h1{font-size:clamp(24px,3.5vw,34px);font-weight:800}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--berry)}
.panel{padding-block:20px 140px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.is-off .pinfo,.prow.is-off .mini{opacity:.55}
.pinfo b{display:block;font-size:15px}
.pinfo span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.on{background:var(--t-teal);color:var(--ink)} .pill.off{background:var(--line);color:var(--off)}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:720px){.prow{grid-template-columns:56px minmax(0,1fr) auto}.pbtns{grid-column:1/-1;justify-content:flex-start}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;max-width:720px}
.box h2{font-size:19px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;align-items:center}
@media (max-width:520px){.catrow{grid-template-columns:1fr 1fr}.catrow .linkbtn{grid-column:1/-1;justify-self:start}}
.trow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo .art{width:140px;border-radius:12px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--berry)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:12px}
.savebar .st{font-weight:700;font-size:14px;min-width:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--ok)}
.dot.dirty{background:var(--warn)}

const catOf=(D,id)=>D.cats.find(c=>c.id===id)||{id:"",name:"Sem categoria",icon:"caixa"};
function artFor(D,p,withTag){
  const c=catOf(D,p.cat);
  const src=(withTag&&p.thumb)?p.thumb:p.photo;
  const inner=p.photo?`<img src="${esc(src)}"${src===p.thumb?` class="sq"`:""} alt="" loading="lazy" decoding="async">`:ICONS[c.icon]||ICONS.caixa;
  return `<div class="art tone-${esc(p.tone||"pink")}">${withTag?`<span class="tag">${esc(c.name)}</span>`:""}${inner}</div>`;
}
function miniFor(D,p){const c=catOf(D,p.cat);return `<div class="mini tone-${esc(p.tone||"pink")}">${p.photo?`<img src="${esc(p.thumb||p.photo)}"${p.thumb?` class="sq"`:""} alt="" loading="lazy" decoding="async">`:(ICONS[c.icon]||ICONS.caixa)}</div>`;}

function ask(title,text,okLabel){
  const d=$("#dlgAsk");
  d.innerHTML=`<div class="dlg"><div class="dlg-head"><h2 id="aTitle">${esc(title)}</h2></div><div class="dlg-body"><p class="hint" style="font-size:15px">${esc(text)}</p></div><div class="dlg-foot"><button class="btn btn-ghost" type="button" data-a="no">Cancelar</button><button class="btn btn-primary" type="button" data-a="yes">${esc(okLabel)}</button></div></div>`;

function marqueeHTML(){
  const ts=activeProducts().filter(p=>p.cat==="topos"&&p.photo);
  if(ts.length<3)return "";
  const item=(p,dup)=>`<button class="mq-item" type="button" data-prod="${esc(p.id)}"${dup?` tabindex="-1" aria-hidden="true"`:""}><img src="${esc(p.thumb||p.photo)}"${p.thumb?` class="sq"`:""} alt="" loading="lazy" decoding="async"><span>${esc(p.name.replace(/^Topo de bolo\s*/i,""))}</span></button>`;
  return `<section class="marquee" aria-label="Topos de bolo"><div class="mq-track" style="--mq-dur:${ts.length*4}s">${ts.map(p=>item(p,false)).join("")}${ts.map(p=>item(p,true)).join("")}</div></section>`;
}
const activeProducts=()=>V().products.filter(p=>p.active!==false&&p.tiers&&p.tiers.length);
function renderChips(){
  const D=V(),used=new Set(activeProducts().map(p=>p.cat));
  const all=[{id:"todos",name:"Todos"},...D.cats.filter(c=>used.has(c.id))];
  if(!all.some(c=>c.id===cat))cat="todos";
  $("#chips").innerHTML=all.map(c=>`<button class="chip" type="button" data-chip="${esc(c.id)}" aria-pressed="${c.id===cat}">${esc(c.name)}</button>`).join("");
}
function renderGrid(){
  const D=V();
  const list=activeProducts().filter(p=>(cat==="todos"||p.cat===cat)&&(!query||(p.name+" "+p.desc+" "+catOf(D,p.cat).name).toLowerCase().includes(query)));
  $("#count").textContent=`${list.length} ${list.length===1?"produto":"produtos"}`;
  $("#grid").innerHTML=list.length?list.map(p=>{
    const min=p.tiers[0][0],u=p.unit||"un";
    const minTxt=u==="un"?(min>1?`mín. ${min} un`:"por unidade"):`por ${u}`;
    return `<button class="card" type="button" data-prod="${esc(p.id)}">${artFor(D,p,true)}
      <div class="info"><h3>${esc(p.name)}</h3><p class="desc">${esc(p.desc)}</p>
      <div class="price"><span><small>a partir de </small><strong>${brl(fromPrice(p))}</strong></span><small>${minTxt}</small></div></div></button>`;
  }).join(""):`<div class="empty">${D.products.length?"Nenhum produto encontrado. Tente outra palavra.":"Esta loja ainda não tem produtos."}</div>`;

function updateFab(){const n=$("#fabN");if(n)n.textContent=validCart().length;}

  const t=current.tiers.find(t=>t[0]===currentQty);$("#pTotal").textContent=brl(tierTotal(t[0],t[1]));

function addToCart(){
  const pers={Nome:$("#fNome").value.trim(),Idade:$("#fIdade").value.trim(),Tema:$("#fTema").value.trim(),Cores:$("#fCores").value.trim()};
  const ev=$("#fEvento");if(ev&&ev.value.trim())pers.Festa=ev.value.trim();
  if($("#fObs").value.trim())pers["Como quer"]=$("#fObs").value.trim();
  LS.set("last_pers",{Nome:pers.Nome,Idade:pers.Idade,Tema:pers.Tema,Cores:pers.Cores});
  cart.push({key:Date.now()+"",id:current.id,qty:currentQty,pers,refs:pRefs.slice()});

/* Cadastro do cliente (fica salvo só neste aparelho) */
const UFS="AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");
const getCli=()=>{const k=LS.get("cliente_v1",null);return k&&k.nome?k:null;};
function fmtTel(t){const n=String(t||"").replace(/\D/g,"");if(n.length===11)return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;if(n.length===10)return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;return t||"";}
function addrText(k){return `${k.rua}, ${k.num}${k.comp?" - "+k.comp:""}, ${k.bairro}, ${k.cidade}/${k.uf}${k.cep?" - CEP "+k.cep:""}${k.ref?" (Ref.: "+k.ref+")":""}`;}
function cliText(){const k=getCli();if(!k)return "Cliente: -";return `Cliente: ${k.nome}\nWhatsApp: ${fmtTel(k.tel)}${k.email?`\nE-mail: ${k.email}`:""}${entrega!=="Retirada"?`\nEndereço de entrega: ${addrText(k)}`:""}`;}
function renderCli(){
  const k=getCli(),el=$("#cCli");if(!el)return;
  el.innerHTML=k?`<div class="clicard"><div><p class="section-label">Pedido de</p><b>${esc(k.nome)}</b><p class="hint">${esc(fmtTel(k.tel))}</p><p class="hint">${esc(addrText(k))}</p></div><button class="linkbtn" type="button" data-cadgo="1">Editar</button></div>`
    :`<div class="clicard"><div><b>Faça seu cadastro</b><p class="hint">Nome, WhatsApp e endereço. Fica salvo neste aparelho para os próximos pedidos.</p></div><button class="btn btn-primary btn-sm" type="button" data-cadgo="1">Cadastrar</button></div>`;
}
let cadReturnCart=false;
function openCad(fromCart){
  cadReturnCart=fromCart;const k=getCli()||{},f=(id,l,v,ph,req,type)=>`<label for="${id}">${l}${req?"":` <span class="opt">(opcional)</span>`}<input id="${id}" type="${type||"text"}" value="${esc(v||"")}" placeholder="${esc(ph||"")}"${type==="tel"?` inputmode="numeric"`:""}></label>`;
  $("#dlgCad").innerHTML=`<form class="dlg" id="formCad" novalidate>
    <div class="dlg-head"><div><p class="section-label">${esc(V().store.name)}</p><h2 id="kTitle">Meu cadastro</h2></div><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
    <div class="dlg-body">
      <p class="hint">Seus dados ficam salvos só neste aparelho e vão junto com o pedido pelo WhatsApp. Assim você não precisa digitar de novo.</p>
      <p class="section-label">Seus dados</p>
      ${f("kNome","Nome completo",k.nome,"Ex.: Mariana Souza",1)}
      <div class="row2">${f("kTel","WhatsApp com DDD",k.tel,"(91) 98765-4321",1,"tel")}${f("kEmail","E-mail",k.email,"voce@email.com",0,"email")}</div>
      <p class="section-label">Endereço</p>
      <div class="row2">${f("kCep","CEP",k.cep,"00000-000",0,"tel")}<label for="kUF">Estado<select id="kUF">${UFS.map(u=>`<option${(k.uf||"PA")===u?" selected":""}>${u}</option>`).join("")}</select></label></div>
      ${f("kRua","Rua / avenida",k.rua,"Ex.: Rua das Flores",1)}
      <div class="row2">${f("kNum","Número",k.num,"Ex.: 120 ou s/n",1)}${f("kComp","Complemento",k.comp,"Ex.: casa 2, apto 31",0)}</div>
      <div class="row2">${f("kBairro","Bairro",k.bairro,"",1)}${f("kCidade","Cidade",k.cidade||V().store.city,"",1)}</div>
      ${f("kRef","Ponto de referência",k.ref,"Ex.: perto da igreja",0)}
      <p class="err" id="kErr" hidden></p>
    </div>
    <div class="dlg-foot">${getCli()?`<button class="linkbtn btn-danger" type="button" data-cadclear="1">Apagar meus dados</button>`:"<span></span>"}<button class="btn btn-primary" type="submit">${cadReturnCart?"Salvar e voltar à sacola":"Salvar cadastro"}</button></div>
  </form>`;
  $("#dlgCad").showModal();

function saveCad(){
  const v=id=>$("#"+id).value.trim();
  const k={nome:v("kNome"),tel:v("kTel"),email:v("kEmail"),cep:v("kCep"),uf:v("kUF"),rua:v("kRua"),num:v("kNum"),comp:v("kComp"),bairro:v("kBairro"),cidade:v("kCidade"),ref:v("kRef")};
  const tel=k.tel.replace(/\D/g,""),err=$("#kErr");
  const miss=[["nome","nome"],["rua","rua"],["num","número"],["bairro","bairro"],["cidade","cidade"]].filter(([key])=>!k[key]).map(([,l])=>l);
  const msg=miss.length?`Preencha: ${miss.join(", ")}.`:(tel.length<10||tel.length>11)?"Confira o WhatsApp: use DDD + número, como (91) 98765-4321.":(k.email&&!/^\S+@\S+\.\S+$/.test(k.email))?"Confira o e-mail ou deixe em branco.":"";
  if(msg){err.textContent=msg;err.hidden=false;return;}
  k.tel=tel;
  if(!LS.set("cliente_v1",k)){err.textContent="Este navegador não deixou salvar. Tente sair do modo anônimo.";err.hidden=false;return;}
  $("#dlgCad").close();
  if(route()==="loja"){const b=document.querySelector('[data-act="cad"]');if(b)b.textContent="Olá, "+k.nome.split(" ")[0];}
  if(cadReturnCart)openCart();
}

/* Sacola */
function saveCart(){if(!LS.set("cart_v2",cart))LS.set("cart_v2",cart.map(i=>Object.assign({},i,{refs:[]})));}
const refsOf=i=>Array.isArray(i.refs)?i.refs:[];
const itemTotal=i=>{const p=V().products.find(x=>x.id===i.id);const t=p&&p.tiers.find(t=>t[0]===i.qty)||(p&&p.tiers[0]);return t?tierTotal(i.qty,t[1]):0;};
const persText=p=>Object.entries(p).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join(" · ");
function minDate(){const D=V(),c=validCart();const d=Math.max(+D.store.minDays||0,...c.map(i=>+(D.products.find(p=>p.id===i.id)||{}).days||0));const dt=new Date();dt.setDate(dt.getDate()+Math.ceil(d*7/5));return dt;}

      <div id="cartForm" style="display:flex;flex-direction:column;gap:14px">
        <p class="section-label">Dados do pedido</p>
        <div id="cCli"></div>
        <label for="cData">Data do evento<input id="cData" type="date"></label>
        <p class="hint" id="cPrazo"></p>
        <div><p class="section-label" style="margin-bottom:8px">Como receber</p>
          <div class="seg" id="cEntrega" role="group" aria-label="Como receber">

            <button type="button" data-ent="Entrega (frete a combinar)" aria-pressed="${entrega!=="Retirada"}">Entrega</button></div></div>
        <p class="err" id="cErr" hidden></p>
        <details><summary class="hint" style="cursor:pointer">Ver a mensagem que será enviada</summary><pre class="msg" id="cMsg"></pre></details>

function renderCart(){

function buildMessage(){
  const D=V(),c=validCart(),total=c.reduce((s,i)=>s+itemTotal(i),0);
  const lines=c.map((i,n)=>{const p=D.products.find(x=>x.id===i.id),r=refsOf(i).length;return `${n+1}) ${p.name} — ${unitName(p,i.qty)} = ${brl(itemTotal(i))}\n   ${persText(i.pers)}${r?`\n   Referência: ${r} foto${r>1?"s":""} (envio em seguida)`:""}`;});
  const nr=c.reduce((s,i)=>s+refsOf(i).length,0);
  return `Olá, ${D.store.name}! Quero fazer um pedido:\nPedido nº ${orderId}${HOSTED?`\nVer pedido com fotos: ${orderLink()}`:""}\n\n${lines.join("\n\n")}\n\nTotal estimado: ${brl(total)}\nData do evento: ${brDate($("#cData").value)||"a combinar"}\nRecebimento: ${entrega}\n${cliText()}\n${nr?`\nVou enviar ${nr} foto${nr>1?"s":""} de referência logo após esta mensagem.\n`:""}\nPedido feito pelo catálogo online.`;
}
function validate(){
  const D=V(),c=validCart(),total=c.reduce((s,i)=>s+itemTotal(i),0);
  if(!c.length)return "Sua sacola está vazia.";
  if(+D.store.minOrder>0&&total<+D.store.minOrder)return `O pedido mínimo é ${brl(D.store.minOrder)}. Faltam ${brl(D.store.minOrder-total)}.`;
  if(!getCli())return "Faça seu cadastro para enviar o pedido.";
  if(!$("#cData").value)return "Informe a data do evento para conferirmos o prazo.";
  if($("#cData").value<iso(minDate()))return `Para esses itens, a data mínima é ${brDate(iso(minDate()))}. Escolha outra data ou fale com a loja.`;
  return "";
}
function refreshSend(){

}

function resizeImage(file,max,type){max=max||640;type=type||"image/jpeg";return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*s),h=Math.round(img.height*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL(type,0.78));};img.onerror=()=>rej(new Error("img"));img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
function squareThumb(file,n){n=n||480;return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  const c=document.createElement("canvas");c.width=c.height=n;const g=c.getContext("2d");
  const t=document.createElement("canvas");t.width=img.width;t.height=img.height;const tg=t.getContext("2d");tg.drawImage(img,0,0);
  let white=true;try{const w=img.width,h=img.height,b=Math.max(2,Math.floor(Math.min(w,h)/100));for(const [x,y,ww,hh] of [[0,0,w,b],[0,h-b,w,b],[0,0,b,h],[w-b,0,b,h]]){const d=tg.getImageData(x,y,ww,hh).data;let s=0;for(let i=0;i<d.length;i+=4)s+=(d[i]+d[i+1]+d[i+2])/3;if(s/(d.length/4)<=238){white=false;break;}}}catch(_){white=false;}
  if(white){g.fillStyle="#fff";g.fillRect(0,0,n,n);}
  else{const k=Math.max(n/img.width,n/img.height);g.filter="blur(18px)";g.drawImage(img,(n-img.width*k)/2,(n-img.height*k)/2,img.width*k,img.height*k);g.filter="none";g.fillStyle="rgba(255,255,255,.25)";g.fillRect(0,0,n,n);}
  const k=Math.min(n/img.width,n/img.height),w=img.width*k,h=img.height*k;g.drawImage(img,(n-w)/2,(n-h)/2,w,h);
  res(c.toDataURL("image/jpeg",0.8));};img.onerror=()=>rej(new Error("img"));img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

  const msg=!name?"Dê um nome ao produto.":!$("#eCat").value?"Crie uma categoria antes de cadastrar produtos.":!tiers.length?"Preencha pelo menos uma faixa com quantidade e preço.":new Set(tiers.map(t=>t[0])).size!==tiers.length?"Há duas faixas com a mesma quantidade.":"";

/* Publicação */
function buildDoc(data){
  const css=document.getElementById("loja-css").textContent;
  const js=document.getElementById("loja-app").textContent;
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  if(HOSTED)return HOST_HEAD+"<title>"+esc("Catálogo "+data.store.name)+"</title>"+HEADMETA+'<meta name="description" content="'+esc(data.store.tagline||"")+'"><meta property="og:title" content="'+esc(data.store.name)+'"><meta property="og:description" content="'+esc(data.store.tagline||"")+'"><style id="loja-css">'+css+'</style></head><body><div id="app"></div><script id="loja-dados" type="application/json">'+json+'<\/script><script id="loja-app">'+js+'<\/script></body></html>';
  return SKEL+"<title>"+esc("Catálogo "+data.store.name)+"</title>"+HEADMETA+'<style id="loja-css">'+css+'</style><div id="app"></div><script id="loja-dados" type="application/json">'+json+'<\/script><script id="loja-app">'+js+'<\/script></body></html>';
}
function downloadSite(){
  const html=buildDoc(draft);
  if(new Blob([html]).size>MAX_BYTES){pubMsg="O catálogo passou do limite de espaço. Remova algumas fotos.";pubKind="err";updateSavebar();return;}
  const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  const a=document.createElement("a");a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  pubMsg="Arquivo index.html baixado. Envie na hospedagem para atualizar o site.";pubKind="ok";updateSavebar();
}
async function publishNow(){
  if(HOSTED){publishHosted();return;}
  if(!artifactNs||publishing)return;
  const html=buildDoc(draft);
  if(new Blob([html]).size>MAX_BYTES){pubMsg="O catálogo passou do limite de espaço. Remova algumas fotos e tente de novo.";pubKind="err";updateSavebar();return;}
  publishing=true;pubMsg="";updateSavebar();
  try{await artifactNs.publish(html);LS.del("loja_draft");dirty=false;pubMsg="Publicado. Atualizando a página…";pubKind="ok";}
  catch(e){
    const c=e&&e.code;pubKind="err";
    if(c==="conflict")pubMsg="Outra versão foi publicada antes. A página vai recarregar com ela.";
    else if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].includes(c))pubMsg="Sua conta pode ver esta loja, mas não pode publicar alterações.";
    else if(c==="too_large")pubMsg="O catálogo ficou grande demais. Remova algumas fotos.";
    else if(c==="rate_limited")pubMsg="Muitas publicações seguidas. Espere um minuto e publique de novo.";
    else pubMsg="Não foi possível publicar agora. Tente de novo em instantes.";
  }
  publishing=false;updateSavebar();
}

/* Pedido salvo na loja (só no site publicado) */
const relPath=u=>typeof u==="string"&&/^img\//.test(u);
function orderLink(){
  const D=V(),c=validCart(),p=c.length&&D.products.find(x=>x.id===c[0].id);
  const f=p&&relPath(p.thumb)?p.thumb:p&&relPath(p.photo)?p.photo:"";
  return `${location.origin}/pedido/${orderId}${f?`?f=${encodeURIComponent(f)}`:p?`?p=${encodeURIComponent(p.id)}`:""}`;
}
function saveOrder(){
  if(!HOSTED)return;
  const D=V(),c=validCart(),k=getCli();if(!c.length||!k)return;
  const body={id:orderId,cliente:{nome:k.nome,tel:k.tel,email:k.email||"",endereco:addrText(k)},entrega,dataEvento:$("#cData").value,
    total:c.reduce((s,i)=>s+itemTotal(i),0),
    itens:c.map(i=>{const p=D.products.find(x=>x.id===i.id);return {produto:p.name,produtoId:p.id,foto:relPath(p.thumb)?p.thumb:relPath(p.photo)?p.photo:"",qtd:i.qty,unidade:unitWord(p),total:itemTotal(i),personalizacao:persText(i.pers),refs:refsOf(i).length};})};
  const fotos=[];c.forEach((i,n)=>refsOf(i).slice(0,3).forEach((r,k)=>{if(/^data:image\//.test(r))fotos.push({item:n,k,data:r});}));
  const id=orderId;
  try{
    const ok=fetch("/api/pedidos",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),keepalive:true});
    if(fotos.length)ok.then(r=>{if(r.ok)return fetch("/api/pedidos?fotos="+encodeURIComponent(id),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({fotos})});}).catch(()=>{});
    else ok.catch(()=>{});
  }catch(_){}
  const h=LS.get("meus_pedidos",[]);if(!h.some(x=>x.id===orderId)){h.unshift({id:orderId,em:new Date().toISOString(),total:body.total,itens:body.itens.map(i=>i.produto+" · "+i.qtd+" "+i.unidade)});LS.set("meus_pedidos",h.slice(0,30));}
}

async function publishHosted(){
  if(publishing)return;
  publishing=true;pubMsg="";updateSavebar();
  try{
    const r=await fetch("/api/catalogo",{method:"PUT",headers:{"content-type":"application/json",authorization:"Bearer "+getSenha()},body:JSON.stringify(draft)});
    let d={};try{d=await r.json();}catch(_){}
    if(r.status===401){setSenha("");isEditor=false;publishing=false;render();return;}
    if(!r.ok)throw new Error(d.erro||"");
    DATA=clone(draft);BASE_HASH=hash(JSON.stringify(DATA));LS.del("loja_draft");dirty=false;
    pubMsg="Publicado! Os clientes já veem esta versão.";pubKind="ok";
  }catch(e){pubKind="err";pubMsg=(e&&e.message)||"Não foi possível publicar agora. Confira a internet e tente de novo.";}
  publishing=false;updateSavebar();
}
function startEditor(){
  const saved=LS.get("loja_draft",null);
  if(saved&&saved.base===BASE_HASH&&saved.draft){draft=saved.draft;dirty=true;}else{draft=clone(DATA);LS.del("loja_draft");}
}

/* ===== Eventos ===== */
function showRefSteps(){
  const c=validCart().filter(i=>refsOf(i).length),box=$("#cRefs"),ok=$("#cOk");
  ok.hidden=false;
  if(!c.length){ok.textContent="Abrimos o WhatsApp com o pedido pronto. Confira a mensagem e toque em enviar.";box.hidden=true;return;}
  ok.textContent="1. No WhatsApp, confira a mensagem e toque em enviar.";
  const D=V(),all=validCart();
  box.innerHTML=`<p class="ok">2. Depois, na mesma conversa, toque no clipe e envie estas fotos de referência:</p>`+c.map(i=>{const p=D.products.find(x=>x.id===i.id);return `<div><p class="hint" style="margin-bottom:6px">Item ${all.indexOf(i)+1} · ${esc(p.name)}</p><div class="refgrid sm">${refsOf(i).map((r,k)=>`<div class="ref"><img src="${esc(r)}" alt="Referência ${k+1}"></div>`).join("")}</div></div>`;}).join("");
  box.hidden=false;
}
document.addEventListener("click",async e=>{
  const wa=e.target.closest("#btnWa");
  if(wa){if(wa.getAttribute("aria-disabled")){e.preventDefault();return;}saveOrder();showRefSteps();return;}
  const t=e.target.closest("button,[data-chip]");if(!t)return;const d=t.dataset;
  if(d.rmref){pRefs.splice(+d.rmref,1);renderRefs();return;}
  if(d.chip){cat=d.chip;renderChips();renderGrid();return;}
  if(d.prod){openProduct(d.prod);return;}
  if(d.act==="cart"){openCart();return;}
  if(d.act==="cad"){openCad(false);return;}
  if(d.cadgo){$("#dlgCart").close();openCad(true);return;}
  if(d.cadclear){if(await ask("Apagar seus dados?","Nome, WhatsApp e endereço serão removidos deste aparelho.","Apagar")){LS.del("cliente_v1");$("#dlgCad").close();render();}return;}
  if(d.q&&current&&t.classList.contains("tier")){currentQty=+d.q;renderTiers();return;}
  if(d.rm){cart=cart.filter(i=>i.key!==d.rm);saveCart();renderCart();updateFab();return;}
  if(d.ent){entrega=d.ent;[...$("#cEntrega").children].forEach(x=>x.setAttribute("aria-pressed",x===t));refreshSend();return;}
  if(t.id==="btnCopy"){const msg=buildMessage();const ok=$("#cOk");
    try{await navigator.clipboard.writeText(msg);ok.textContent="Pedido copiado. Cole no WhatsApp da loja.";}
    catch(_){const det=$("#cMsg").closest("details");det.open=true;const r=document.createRange();r.selectNodeContents($("#cMsg"));const s=getSelection();s.removeAllRanges();s.addRange(r);ok.textContent="Texto selecionado. Copie com Ctrl+C ou segurando o dedo.";}
    ok.hidden=false;return;}
  if(!isEditor)return;
  if(d.tab){panelTab=d.tab;render();return;}
  if(d.new){openEditor(null);return;}
  if(d.edit){openEditor(d.edit);return;}
  if(d.toggle){const p=draft.products.find(x=>x.id===d.toggle);p.active=p.active===false;markDirty();$("#ptab").innerHTML=productsTab();return;}
  if(d.dup){const i=draft.products.findIndex(x=>x.id===d.dup);const p=clone(draft.products[i]);p.id=uid();p.name+=" (cópia)";draft.products.splice(i+1,0,p);markDirty();$("#ptab").innerHTML=productsTab();return;}
  if(d.del){const p=draft.products.find(x=>x.id===d.del);if(await ask("Excluir produto?",`“${p.name}” sai do catálogo quando você publicar.`,"Excluir")){draft.products=draft.products.filter(x=>x.id!==d.del);markDirty();$("#ptab").innerHTML=productsTab();}return;}
  if(d.tadd){edTiers.push([0,0]);renderEdTiers();return;}
  if(d.tdel){edTiers.splice(+d.tdel,1);renderEdTiers();return;}
  if(d.rmphoto){edPhoto="";edThumb="";renderEdPhoto();return;}
  if(d.rmlogo){draft.store.logo="";markDirty();$("#ptab").innerHTML=storeTab();return;}
  if(d.catadd){const c={id:"c"+Date.now().toString(36),name:"Nova categoria",icon:"caixa"};draft.cats.push(c);markDirty();$("#ptab").innerHTML=catsTab();const inp=document.querySelector(`[data-catname="${c.id}"]`);if(inp){inp.focus();inp.select();}return;}
  if(d.catdel){draft.cats=draft.cats.filter(c=>c.id!==d.catdel);markDirty();$("#ptab").innerHTML=catsTab();return;}
  if(d.discard){if(await ask("Descartar alterações?","Tudo o que você mudou desde a última publicação será perdido.","Descartar")){draft=clone(DATA);dirty=false;pubMsg="";LS.del("loja_draft");render();}return;}
  if(d.publish){publishNow();return;}
  if(d.sair){setSenha("");isEditor=false;draft=null;dirty=false;location.hash="";render();return;}
});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="formProd")addToCart();
  else if(e.target.id==="formEdit")saveEditor();
  else if(e.target.id==="formCad")saveCad();
  else if(e.target.id==="formLogin")loginPanel();});
async function loginPanel(){
  const v=$("#lSenha").value,err=$("#lErr"),btn=$("#lBtn");
  if(!v){err.textContent="Digite a senha.";err.hidden=false;return;}
  btn.disabled=true;btn.textContent="Entrando…";
  if(await senhaOk(v)){setSenha(v,$("#lKeep").checked);isEditor=true;startEditor();render();}
  else{err.textContent="Senha incorreta.";err.hidden=false;btn.disabled=false;btn.textContent="Entrar";}
}
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="q"){query=t.value.trim().toLowerCase();renderGrid();return;}
  if(t.id==="cNome"){LS.set("c_nome",t.value);refreshSend();return;}
  if(t.id==="cData"){refreshSend();return;}
  if(!isEditor)return;
  if(d.tq!=null){edTiers[+d.tq][0]=t.value;return;}
  if(d.tp!=null){edTiers[+d.tp][1]=t.value;return;}
  if(d.store){draft.store[d.store]=d.num?Math.max(0,+t.value||0):t.value;markDirty();
    if(d.store==="whatsapp")$("#waHint").textContent=waHint(t.value);
    if(d.store==="accent")document.body.className="acc-"+t.value;
    if(d.store==="name"){const h=$(".phead h1");if(h)h.textContent=t.value;}
    if(d.store==="logoShape"){const lp=$("#logoPrev");if(lp)lp.innerHTML=logoHTML(draft.store);}return;}
  if(d.temas){draft.temas=t.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);markDirty();return;}
  if(d.catname){const c=draft.cats.find(c=>c.id===d.catname);c.name=t.value;markDirty();return;}
});
document.addEventListener("change",async e=>{
  const t=e.target,d=t.dataset;
  if(d.caticon&&isEditor){draft.cats.find(c=>c.id===d.caticon).icon=t.value;markDirty();return;}
  if(d.store==="accent"&&isEditor){draft.store.accent=t.value;document.body.className="acc-"+t.value;markDirty();return;}
  if(t.id==="eTone"||t.id==="eCat"){renderEdPhoto();return;}
  if(t.id==="sLogoFile"&&t.files&&t.files[0]&&isEditor){
    try{draft.store.logo=await resizeImage(t.files[0],360,"image/png");if(!draft.store.logoShape)draft.store.logoShape="round";markDirty();$("#ptab").innerHTML=storeTab();}
    catch(_){const er=$("#logoErr");er.textContent="Não consegui abrir essa imagem. Tente um arquivo PNG ou JPG.";er.hidden=false;}
    return;}
  if(t.id==="fRefFile"&&t.files){
    const files=[...t.files].slice(0,MAX_REFS-pRefs.length);
    for(const f of files){try{pRefs.push(await resizeImage(f,480));}catch(_){}}
    t.value="";renderRefs();return;}
  if(t.id==="eFile"&&t.files&&t.files[0]){const err=$("#eErr");
    try{edPhoto=await resizeImage(t.files[0]);try{edThumb=await squareThumb(t.files[0]);}catch(_){edThumb="";}err.hidden=true;}catch(_){err.textContent="Não consegui abrir essa imagem. Tente uma foto em JPG ou PNG.";err.hidden=false;}
    renderEdPhoto();}
});

/* ===== Início ===== */
render();
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const [u,a]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
      artifactNs=a;isEditor=!!(a&&u&&await u.canEdit());
    }
  }catch(_){isEditor=false;}
  if(HOSTED){
    try{const r=await fetch("/api/catalogo",{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&Array.isArray(d.products)){DATA=d;BASE_HASH=hash(JSON.stringify(DATA));}}}catch(_){}
    const sv=getSenha();isEditor=!!(sv&&await senhaOk(sv));if(sv&&!isEditor)setSenha("");
  }
  accessChecked=true;
  if(isEditor)startEditor();
  render();
})();
})();
</script></body></html>
